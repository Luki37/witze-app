<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Witze-App</title>
  </head>
  <body>
    <div>
      <h1>Witze App</h1>
      <div class="current-joke">
        <p  id="random-joke" class="current-joke__text">
          Klicke auf den Button um einen Witz zu laden!
        </p>
        <div class="current-joke__actions">
          <button id="getJoke" class="current-joke__load">Neuen Witz laden</button
          ><button id="saveJoke" class="current-joke__save">Witz speichern <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
  <path stroke-linecap="round" stroke-linejoin="round" d="M17.593 3.322c1.1.128 1.907 1.077 1.907 2.185V21L12 17.25 4.5 21V5.507c0-1.108.806-2.057 1.907-2.185a48.507 48.507 0 0 1 11.186 0Z" />
</svg>
</button>
        </div>
        </div>
        <div class="storage">
          <h2 class="storage__heading">Gespeicherte Witze</h2>
          <div id="wrapper"><p><i>Noch keine gespeicherten Witze</i></p></div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
